name: Build OnePlus 11 Mainline Kernel

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - anykernel3
          - raw
          - boot_img
      extra_configs:
        description: 'Extra config fragments (space-separated, relative to arch/arm64/configs/)'
        required: false
        default: ''

# ─── tunables ────────────────────────────────────────────────────────────────
env:
  KERNEL_REPO: ${{ github.repository }}
  KERNEL_BRANCH: "salami-6.14"

  # Clang/LLVM — AOSP prebuilt, bump string to update
  CLANG_VERSION: "r536225"

  # Config fragment order matters — do not reorder
  DEFCONFIG: "defconfig"
  CONFIG_FRAGMENTS: "sm8550.config op11.config hardening.config"

  # DTS fragments (your custom .dts files)
  DTS_FRAGMENTS_DIR: "arch/arm64/boot/dts/qcom"

  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out

  AK3_REPO: "https://github.com/osm0sis/AnyKernel3"
  AK3_BRANCH: "master"
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  build:
    name: Kernel build — OnePlus 11 (SM8550)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1
          submodules: recursive

      # ── 2. Dependencies ────────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            flex git kmod libelf-dev libssl-dev lz4 \
            python3 rsync unzip xz-utils zstd \
            device-tree-compiler

      # ── 3. Clang toolchain ─────────────────────────────────────────────────
      - name: Cache clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_VERSION }}

      - name: Download clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -L \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${{ env.CLANG_VERSION }}.tar.gz" \
            -o clang.tar.gz && \
            tar -xzf clang.tar.gz -C clang && \
            rm clang.tar.gz || {
              echo "AOSP fetch failed — falling back to apt clang"
              sudo apt-get install -y clang lld llvm
              ln -sf $(which clang) clang/bin/clang
              ln -sf $(which ld.lld) clang/bin/ld.lld
            }

      - name: Add clang to PATH
        run: echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      # ── 4. Build environment ───────────────────────────────────────────────
      - name: Set build environment
        run: |
          echo "KBUILD_BUILD_USER=github-ci" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=actions"   >> $GITHUB_ENV

          FLAGS="ARCH=${{ env.ARCH }} SUBARCH=${{ env.SUBARCH }}"
          FLAGS="$FLAGS LLVM=1 LLVM_IAS=1"
          FLAGS="$FLAGS CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm"
          FLAGS="$FLAGS OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"
          FLAGS="$FLAGS CROSS_COMPILE=aarch64-linux-gnu-"
          FLAGS="$FLAGS O=${{ env.OUT_DIR }}"
          echo "MAKE_FLAGS=$FLAGS" >> $GITHUB_ENV

      # ── 5. Configure — fragment merge chain ───────────────────────────────
      - name: Configure kernel
        run: |
          mkdir -p ${{ env.OUT_DIR }}

          # Step 1: base defconfig
          make ${{ env.MAKE_FLAGS }} ${{ env.DEFCONFIG }}

          # Step 2: merge fragment chain
          #   defconfig → sm8550.config → op11.config → hardening.config
          FRAGS=""
          for frag in ${{ env.CONFIG_FRAGMENTS }}; do
            cfg="arch/arm64/configs/$frag"
            if [ -f "$cfg" ]; then
              FRAGS="$FRAGS $cfg"
              echo "  + $frag"
            else
              echo "::warning::Config fragment not found: $cfg — skipping"
            fi
          done

          if [ -n "$FRAGS" ]; then
            ./scripts/kconfig/merge_config.sh \
              -m ${{ env.OUT_DIR }}/.config $FRAGS
          fi

          # Step 3: any extra fragments from workflow input
          if [ -n "${{ github.event.inputs.extra_configs }}" ]; then
            EXTRA=""
            for frag in ${{ github.event.inputs.extra_configs }}; do
              EXTRA="$EXTRA arch/arm64/configs/$frag"
            done
            ./scripts/kconfig/merge_config.sh \
              -m ${{ env.OUT_DIR }}/.config $EXTRA
          fi

          # Resolve any conflicts / new symbols
          make ${{ env.MAKE_FLAGS }} olddefconfig

          echo "── Final config summary ──"
          make ${{ env.MAKE_FLAGS }} listnewconfig 2>/dev/null || true

      # ── 6. Verify DTS fragments ────────────────────────────────────────────
      - name: Verify DTS fragments
        run: |
          FRAG_DIR="${{ env.DTS_FRAGMENTS_DIR }}"
          if compgen -G "${FRAG_DIR}/*.dts" > /dev/null 2>&1; then
            echo "Checking DTS fragments in $FRAG_DIR..."
            FAILED=0
            for dts in ${FRAG_DIR}/*.dts; do
              dtc -I dts -O dtb "$dts" -o /dev/null 2>&1 && \
                echo "  ✓ $dts" || {
                echo "  ✗ $dts"
                FAILED=$((FAILED+1))
              }
            done
            [ $FAILED -eq 0 ] || echo "::warning::$FAILED DTS fragment(s) had warnings"
          else
            echo "No standalone .dts files in $FRAG_DIR — relying on Kbuild DTB rules"
          fi

      # ── 7. Build ───────────────────────────────────────────────────────────
      - name: Build kernel
        run: |
          make ${{ env.MAKE_FLAGS }} -j$(nproc --all) \
            Image Image.gz dtbs modules 2>&1 | tee build.log

          test -f ${{ env.OUT_DIR }}/arch/arm64/boot/Image || {
            echo "::error::Kernel Image missing — build failed"
            tail -80 build.log
            exit 1
          }

          echo "── Kernel release ──"
          cat ${{ env.OUT_DIR }}/include/config/kernel.release 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7

      # ── 8. Collect outputs ─────────────────────────────────────────────────
      - name: Collect outputs
        run: |
          mkdir -p dist/raw/dtbs

          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image      dist/raw/
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz   dist/raw/ 2>/dev/null || true

          find ${{ env.OUT_DIR }}/arch/arm64/boot/dts \
            -name "*.dtb" -exec cp {} dist/raw/dtbs/ \;

          make ${{ env.MAKE_FLAGS }} \
            INSTALL_MOD_PATH=dist/raw/modules \
            INSTALL_MOD_STRIP=1 modules_install

          echo "── dist/raw ──"
          ls -lh dist/raw/
          echo "── DTBs ──"
          ls dist/raw/dtbs/

      # ── 9. AnyKernel3 zip ─────────────────────────────────────────────────
      - name: Build AnyKernel3 zip
        if: >
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'anykernel3'
        run: |
          git clone --depth=1 ${{ env.AK3_REPO }} -b ${{ env.AK3_BRANCH }} ak3

          cp dist/raw/Image ak3/
          cp dist/raw/Image.gz ak3/ 2>/dev/null || true
          mkdir -p ak3/dtbs
          cp dist/raw/dtbs/*.dtb ak3/dtbs/ 2>/dev/null || true

          # Disable device check — we're managing compatibility ourselves
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' ak3/anykernel.sh || true

          ZIPNAME="op11-mainline-$(date +%Y%m%d-%H%M)-r${{ github.run_number }}.zip"
          cd ak3 && zip -r9 "../dist/$ZIPNAME" . \
            -x ".git/*" -x "*.placeholder"
          cd ..

          echo "AK3_ZIP=$ZIPNAME" >> $GITHUB_ENV
          ls -lh "dist/$ZIPNAME"

      # ── 10. boot.img ──────────────────────────────────────────────────────
      - name: Build boot.img
        if: >
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'boot_img'
        run: |
          if [ -z "${{ secrets.BOOT_IMG_URL }}" ]; then
            echo "::warning::BOOT_IMG_URL secret not set — skipping boot.img"
            echo "Add your stock boot.img URL as a repo secret to enable this step."
            exit 0
          fi

          pip3 install --quiet mkbootimg 2>/dev/null || \
            sudo apt-get install -y --no-install-recommends mkbootimg

          curl -L "${{ secrets.BOOT_IMG_URL }}" -o base_boot.img

          unpack_bootimg --boot_img base_boot.img --out unpack/

          mkbootimg \
            --kernel dist/raw/Image \
            --ramdisk unpack/ramdisk \
            --cmdline "$(cat unpack/kernel_cmdline 2>/dev/null || echo '')" \
            --header_version "$(cat unpack/boot_header_version 2>/dev/null || echo 2)" \
            --os_version "$(cat unpack/os_version 2>/dev/null || echo '')" \
            --os_patch_level "$(cat unpack/os_patch_level 2>/dev/null || echo '')" \
            --output dist/boot.img

          ls -lh dist/boot.img

      # ── 11. Upload artifacts ───────────────────────────────────────────────
      - name: Upload raw artifacts
        if: >
          github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'raw'
        uses: actions/upload-artifact@v4
        with:
          name: op11-kernel-raw-r${{ github.run_number }}
          path: dist/raw/
          retention-days: 14

      - name: Upload AnyKernel3 zip
        if: >
          (github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'anykernel3') &&
          env.AK3_ZIP != ''
        uses: actions/upload-artifact@v4
        with:
          name: op11-anykernel3-r${{ github.run_number }}
          path: dist/${{ env.AK3_ZIP }}
          retention-days: 14

      - name: Upload boot.img
        if: >
          (github.event.inputs.build_type == 'all' ||
          github.event.inputs.build_type == 'boot_img') &&
          hashFiles('dist/boot.img') != ''
        uses: actions/upload-artifact@v4
        with:
          name: op11-boot-img-r${{ github.run_number }}
          path: dist/boot.img
          retention-days: 14

      # ── 12. Summary ────────────────────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "════════════════════════════════════════════"
          echo "  OnePlus 11 Mainline — Build #${{ github.run_number }}"
          echo "════════════════════════════════════════════"
          echo "  Branch     : ${{ env.KERNEL_BRANCH }}"
          echo "  Build type : ${{ github.event.inputs.build_type }}"
          echo "  Triggered  : ${{ github.actor }}"
          echo "  Config     : ${{ env.DEFCONFIG }} + ${{ env.CONFIG_FRAGMENTS }}"
          echo "────────────────────────────────────────────"
          echo "  Artifacts:"
          ls -lh dist/ 2>/dev/null || echo "  (none)"
          echo "════════════════════════════════════════════"
